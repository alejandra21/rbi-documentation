info:
  name: Loan Application Documents
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/api/workflows/loan-application-documents/:loan_application_id/?phase=borrower_eligibility"
  params:
    - name: loan_application_id
      value: "15597"
      type: path
    - name: phase
      value: borrower_eligibility
      type: query
    - name: phase
      value: tiering
      type: query
      disabled: true
    - name: phase
      value: credit_review
      type: query
      disabled: true
    - name: phase
      value: collateral_review
      type: query
      disabled: true
  auth: inherit

docs: |-
  Phase document list for a loan, sourced live from the POS API.

  Expected statuses:
    - 200: {phase, loan_application_id, documents}
    - 400: phase missing or not a valid phase slug
    - 502: POS unreachable / sign-in failed (body has the upstream reason)

  Phase slugs come from PHASE_DOCUMENTS in
  ai_underwriting/workflows/constants.py.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
