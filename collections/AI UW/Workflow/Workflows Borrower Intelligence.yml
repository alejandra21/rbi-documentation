info:
  name: Workflows Borrower Intelligence
  type: http
  seq: 11

http:
  method: POST
  url: "{{base_url}}/api/workflows/borrower-intelligence/"
  body:
    type: json
    data: |-
      {
          "borrower_eligibility_validation": "{{borrower_eligibility_validation_id}}",
          "source": "ai-uw-app"
          //"loan_id": 382,
          //"callback_url": "https://webhook.site/95a17655-ff33-4937-a377-0aa128085710"
      }
  auth: inherit

docs: |
  Endpoint que llama el frontend (AI UW app, Fase 2.2 — boton "Re-run Borrower
  Intelligence", y la entrada "2.2 Borrower Intelligence" del dropdown
  "Re-execute By Phase"). Mismo patron que "Workflows Entity Layered Analysis":
  el backend firma con SigV4 la ruta del dispatcher
  (AI_UW_LAMBDA_URL + /workflows/borrower-intelligence/run) desde una tarea de
  Celery. Responde 202 Accepted con el WorkflowRun (phase = PHASE_2_2).

  No hace falta configurar nada nuevo: usa el mismo AI_UW_LAMBDA_URL, el mismo
  AI_UW_LAMBDA_TIMEOUT y las mismas credenciales SigV4 que el resto de los
  triggers.

  ── Lo que hay que saber antes de leer los logs ────────────────────────────

  El Lambda manda el arbol de ownership a Elementix y hace poll INLINE hasta que
  el job termina: presupuesto de 840s dentro de un timeout de 900s. El
  dispatcher corre a 300s, asi que en una corrida larga la llamada firmada
  VUELVE CON ERROR aunque la corrida este perfectamente sana: un Lambda hijo no
  se muere cuando su invocador se muere. La corrida sigue, escribe su propia
  fila de validacion (la escribe ANTES de llamar a Elementix) y reporta el
  resultado por callback.

  Por eso la tarea de Celery NO toca el status del WorkflowRun — marcarlo
  fallido en base a esa respuesta reportaria como roto algo que salio bien. El
  status final lo pone POST /api/workflows/callback/, igual que en las demas
  fases. Un error en el log del backend significa "no pudimos confirmar", no
  "no corrio": para saber que paso, mira job_status en la validacion.

  Si necesitas la respuesta completa en la misma llamada (sin el corte de 300s),
  usa "ai-uw-lambda > borrower-intelligence > Run Borrower Intelligence", que
  pega directo al Function URL del Lambda.

  ── Body ───────────────────────────────────────────────────────────────────

    borrower_eligibility_validation  UUID, opcional pero MANDALO SIEMPRE que lo
                                     tengas: dice CUAL arbol de ownership leer.
                                     De ahi se derivan loan_id y
                                     workflow_loan_summary, que es el vinculo
                                     autoritativo.
    loan_id                          alternativa si no tenes la validacion. El
                                     orquestador cae entonces a "la ultima
                                     validacion de Fase 1 del loan" — y despues
                                     de un re-run de Fase 1 esa "ultima" no es
                                     la corrida que tenias en mente: lee el
                                     arbol VIEJO y devuelve 200.
    source                           opcional (default "external_app"). El
                                     frontend manda "ai-uw-app".
    callback_url                     opcional — el frontend no lo manda; hace
                                     polling sobre GET /api/workflows/:id/.

  Uno de los dos identificadores tiene que venir; si no: 400 "Provide
  borrower_eligibility_validation or loan_id."

  ── Precondicion: Fase 1 tiene que haber trazado el arbol ──────────────────

  La fase lee GET /api/workflows/entity-owners/?borrower_eligibility_validation=<id>&source=ai_layered.
  Sin owners trazados no hay a quien preguntar y la corrida cierra en
  job_status="failed". Corre primero "Workflows Entity Layered Analysis".

  ── Que NO pasa ────────────────────────────────────────────────────────────

  Ningun campo phase_* del WorkflowLoanSummary se toca: la Fase 2.2 no tiene
  columna propia y usar la de otra fase la reportaria mal. El WorkflowRun
  (phase=PHASE_2_2) es lo unico que trackea la corrida.

  El Lambda crea la BorrowerIntelligenceValidation el mismo. El backend no
  persiste el payload ni escribe el status del run.

  ── Polling ────────────────────────────────────────────────────────────────

    GET /api/workflows/:id/  hasta que status deje de ser "processing".
    "completed" / "error" es sobre la LLAMADA, no sobre el veredicto: una corrida
    que termino con garantes sin resolver igual es una respuesta. El veredicto
    esta en la validacion (job_status, ai_determined_status).

    Ese status lo escribe el callback del workflow, no la tarea de Celery — asi
    que el run se queda en "processing" hasta que la corrida termina de verdad,
    aunque la llamada al dispatcher ya haya cortado a los 300s. El frontend tapa
    a los 15 minutos (el presupuesto del Lambda es 840s).

  Para leer resultados: "Validations > 2.2 Borrower Intelligence".

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setEnvVar("workflow_run_id_phase_2", res.body.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
