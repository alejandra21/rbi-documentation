info:
  name: 2.2- [Borrower Intelligence] Subjects
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/api/workflows/borrower-intelligence-subjects/?validation={{borrower_intelligence_validation_id}}"
  params:
    - name: validation
      value: "{{borrower_intelligence_validation_id}}"
      type: query
    - name: entity_owner
      value: ""
      type: query
      disabled: true
  auth: inherit

docs: |
  Una fila por persona DISTINTA resuelta por Elementix — no una por nombre
  enviado: los alias se colapsan en una sola persona y el alias que llego ahi
  queda en `matched_via`.

  Filtros:
    validation=<uuid>     todas las personas de una corrida de la fase
    entity_owner=<uuid>   el track record de UN nodo del arbol de la Fase 1. Este
                          es el filtro que permite colgar el bloque de Elementix
                          del nodo correcto sin re-matchear nombres del lado del
                          cliente.
    search=<texto>        sobre guarantor_name / person_name / tier

  Sin paginacion: array pelado. Orden forzado a -created.

  ── Como leerlo sin equivocarse ────────────────────────────────────────────

    status                "OK" o "Error". Un subject con "Error" SE PERSISTE
                          igual, con identidad + `message` y todo lo demas en su
                          default — el fallo queda visible en vez de que la
                          persona desaparezca. Guarda las metricas detras de
                          status === "OK", no detras de "los bloques vienen
                          vacios".
    entity_owner          puede ser null ("no hubo match confiable con ninguna
                          fila del arbol"). El frontend hace un segundo intento
                          por nombre (guarantor_name / person_name / aliases) y,
                          si tampoco, lista la persona aparte en vez de tirarla.
    cumulative_funded_volume, average_sell_price, mortgage_amount,
    mortgage_average      DECIMALES COMO STRING ("1250000.00").
    los bloques crudos    management_experience / verified_exits / mortgages /
                          foreclosures / ownership_entities / property_locations
                          / msa vienen VERBATIM de Elementix. Adentro, la plata
                          de purchase / sale / mortgage_amount es STRING; los
                          agregados (count, amount, average,
                          cumulative_funded_volume) son NUMEROS.
    property_locations    mapa { estado: conteo }. La clave literal "Unknown"
                          existe (operaciones sin estado) — no la esconder.
    msa                   mapa { region: conteo }. Las operaciones sin region
                          simplemente se omiten.
    tier                  Platinum / Gold / Silver / Bronze / First-Time Borrower
                          (>=10 / 6-9 / 3-5 / 1-2 / 0 proyectos completados en
                          los ultimos 36 meses). Sin choices en la DB, es texto
                          libre.

  Contrato del proveedor: API_DOCUMENTATION_ELEMENTIX_MULTI_ENTITY.md.
  Contrato del orquestador: docs/BORROWER_INTELLIGENCE.md.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
