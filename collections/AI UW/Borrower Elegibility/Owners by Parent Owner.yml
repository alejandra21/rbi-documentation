docs: |-
  New `parent_owner` filter on EntityOwnerFilter (backend PR #94). Returns the
  direct children of an entity owner — one level down the layered ownership
  tree written by the entity-ownership-tracing Lambda.

  Walk the whole tree with:
    GET /api/workflows/entity-owners/?borrower_eligibility_validation=<id>
  then drill into a node with this request.

