info:
  name: Cost Items - Sync (CB-03)
  type: http
  seq: 11

http:
  method: POST
  url: "{{base_url}}/panel/extensions/{{extension_id}}/cost-items/sync"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

docs:
  content: |
    Rebuilds the automatic line items behind the Section 3 breakdown from the
    extension + investor config. Run this first, then read the breakdown on the
    extension detail.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
