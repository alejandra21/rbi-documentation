info:
  name: Extensions - List
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/panel/extensions"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: page
      value: "1"
      type: query
      enabled: true
    - name: limit
      value: "10"
      type: query
      enabled: true
    - name: search
      value: ""
      type: query
      enabled: false
  auth: inherit

docs:
  content: Pick an id from here into the `extension_id` environment variable.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
