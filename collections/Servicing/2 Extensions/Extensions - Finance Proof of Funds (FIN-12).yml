info:
  name: Extensions - Finance Proof of Funds (FIN-12)
  type: http
  seq: 10

http:
  method: GET
  url: "{{base_url}}/panel/extensions/{{extension_id}}/finance/proof-of-funds"
  auth: inherit

docs:
  content: |
    Proxies Finance's proof-of-funds document. It exists because their endpoint
    needs THEIR api key — a plain link in the UI would 401 in the agent's
    browser, so servicing fetches it server-side.

    Needs `proofOfFundsUrl` to have arrived on a decision first. Without a
    configured Finance API this can't return a real document locally; what you
    are checking is that it fails cleanly rather than leaking the key or 500ing.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
