docs:
  content: |
    Servicing backend — Extensions ↔ Finance batch
    (branch `integration/extensions-finance`).

    Three auth surfaces, do not mix them up:

    - `{{base_url}}` — private panel routes. Bearer JWT, admin/superadmin only
      (`requireRole(ADMIN_ROLES)`). Inherited from the collection.
    - `{{servicing_api}}` — external read API for other teams. DB-backed API key
      as `x-api-key` (or `Authorization: Bearer <plaintext>`). Never a JWT.
    - `{{public_url}}` — genuinely public. The signed document link carries its
      own token and takes no auth header at all.

    Run the folders in order: API Keys mints the keys the later folders use.
    "Scope Isolation" is the interesting one — every request in it must FAIL.

    Companion doc: servicing-backend `docs/testing/extensions-finance-qa.md`.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
