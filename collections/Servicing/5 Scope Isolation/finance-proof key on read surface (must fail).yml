info:
  name: finance-proof key on read surface (must fail)
  type: http
  seq: 1

http:
  method: GET
  url: "{{servicing_api}}/extensions"
  headers:
    - name: x-api-key
      value: "{{finance_api_key}}"
  auth: none

docs:
  content: |
    Finance's narrow key pointed at the general read surface. Must be REFUSED.

    A 200 means finance:proof has been widened, or a route moved above the
    protectExternalRead line. Either way Finance can now read the whole
    servicing dataset.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
