info:
  name: proof-only key on decision (must fail)
  type: http
  seq: 6

http:
  method: POST
  url: "{{servicing_api}}/extension-fee/decision"
  headers:
    - name: x-api-key
      value: "{{proof_only_key}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "eventId": "evt-scope-test-001",
        "externalRecordId": "{{extension_id}}",
        "decision": "APPROVED"
      }
  auth: none

docs:
  content: |
    finance:proof is a READ scope. A key holding only it must not be able to
    write a decision — that separation is why FIN-11 has two finance scopes
    instead of one.

    A 200 here means anyone who can read a borrower's proof can also mark the
    funds verified and unblock closing the extension.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
