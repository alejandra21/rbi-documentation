info:
  name: servicing-read key on borrower proof (must fail)
  type: http
  seq: 3

http:
  method: GET
  url: "{{servicing_api}}/extension-fee/{{extension_id}}/borrower-proof"
  headers:
    - name: x-api-key
      value: "{{read_api_key}}"
  auth: none

docs:
  content: |
    The mirror image: the broad read key must NOT reach the borrower's payment
    proof. Read access to servicing data does not imply access to a borrower's
    banking evidence.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
