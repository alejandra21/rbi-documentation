info:
  name: API Keys - Create (finance-proof)
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/panel/servicing-api-keys"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "label": "finance-local-test",
        "scopes": ["finance:proof"]
      }
  auth: inherit

docs:
  content: |
    Finance's narrow key. Copy `result.plaintext` into the `finance_api_key`
    environment variable — it is shown ONCE and is not recoverable.

    Omitting `scopes` entirely mints an all-access key. Don't, for this test:
    the whole point is proving the narrow scope cannot reach the read surface.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
