info:
  name: API Keys - List
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/panel/servicing-api-keys"
  headers:
    - name: Content-Type
      value: application/json
  auth: inherit

docs:
  content: |
    Never returns the plaintext or the hash — only metadata.

    Check the envelope carries `availableScopes` next to `result`: that is the
    field whose missing type on IResponse broke the develop build (TS2353,
    fixed in #90). If it is absent here, the fix did not make it into the branch.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
