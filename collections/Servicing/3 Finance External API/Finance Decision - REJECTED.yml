info:
  name: Finance Decision - REJECTED
  type: http
  seq: 6

http:
  method: POST
  url: "{{servicing_api}}/extension-fee/decision"
  headers:
    - name: x-api-key
      value: "{{finance_api_key}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "eventId": "evt-local-reject-001",
        "externalRecordId": "{{extension_id}}",
        "decision": "REJECTED",
        "verifiedBy": "finance-qa",
        "rejectReason": "Amount does not match the wire we received"
      }
  auth: none

docs:
  content: |
    The unhappy path, and the start of FIN-07: a rejected proof is followed by a
    fresh upload, and the borrower-proof endpoint must then serve the NEW one.

    Check the extension detail afterwards — status REJECTED with the reason
    surfaced, and the finalize gate blocking again.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
