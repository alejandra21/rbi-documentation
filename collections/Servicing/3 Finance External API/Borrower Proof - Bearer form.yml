info:
  name: Borrower Proof - Bearer form
  type: http
  seq: 2

http:
  method: GET
  url: "{{servicing_api}}/extension-fee/{{extension_id}}/borrower-proof"
  headers:
    - name: Authorization
      value: "Bearer {{finance_api_key}}"
  auth: none

docs:
  content: |
    Same key, sent as a bearer instead of x-api-key. FIN-11 accepts both forms,
    so this must behave identically to the request above.

    Careful reading the result: this is the API key as a bearer, NOT a JWT. If
    this ever starts accepting an actual user JWT, the external router has been
    wired to ensureToken by mistake and the whole surface changed shape.
  type: text/markdown

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 0
